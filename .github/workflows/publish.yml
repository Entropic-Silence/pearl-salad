name: Build and publish GPU image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Test replica configuration
        run: python3 -m unittest -v
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build locally for smoke tests
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: pearl-salad:test
      - name: Smoke test without GPU or mining
        run: |
          # WildRig returns 1 after printing help; verify both status and content.
          result=0
          docker run --rm --entrypoint /opt/miner/wildrig-multi pearl-salad:test --help > help-output.txt 2>&1 || result=$?
          cat help-output.txt
          test "$result" -le 1
          grep -q 'Usage: wildrig-multi' help-output.txt
          grep -q 'pearlhash' help-output.txt
          docker run --rm -e DRY_RUN=1 -e WALLET=prl1pqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq pearl-salad:test
      - name: Push tested image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag pearl-salad:test "$IMAGE:latest"
          docker tag pearl-salad:test "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:latest"
